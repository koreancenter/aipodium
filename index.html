  <script>
    // Prevent Vite HMR WebSocket connection errors in Cloud Run / iframe proxy environment
    (function() {
      var OriginalWebSocket = window.WebSocket;
      if (!OriginalWebSocket) return;
      function DummyWebSocket() {
        var target = new EventTarget();
        target.readyState = 1; // OPEN
        target.OPEN = 1;
        target.CLOSED = 3;
        target.CLOSING = 2;
        target.CONNECTING = 0;
        target.send = function() {};
        target.close = function() {};
        return target;
      }
      window.WebSocket = function(url, protocols) {
        if (
          (typeof url === 'string' && (url.indexOf(':24678') !== -1 || url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) ||
          protocols === 'vite-hmr' ||
          (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)
        ) {
          return new DummyWebSocket();
        }
        return new OriginalWebSocket(url, protocols);
      };
      window.WebSocket.prototype = OriginalWebSocket.prototype;
      window.WebSocket.CONNECTING = 0;
      window.WebSocket.OPEN = 1;
      window.WebSocket.CLOSING = 2;
      window.WebSocket.CLOSED = 3;

      window.addEventListener('error', function(e) {
        if (
          (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1 || e.message.indexOf('wss://') !== -1)) ||
          (e.error && String(e.error).indexOf('WebSocket') !== -1)
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
    })();
  </script>
  <title>AI Podium - 내가 지휘하는 AI 오케스트라</title>
  <meta name="description" content="외부 유출 걱정 없는 안전한 환경에서 흩어진 자료를 하나의 명확한 기준 문서로 통합하세요." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0D0F14" />
  <script>
    (function() {
      try {
        var palettes = {
          default: { main: '#0D0F14', surface: '#11141B', editor: '#151922', elevated: '#1A1F2B', accent: '#38BDF8', text: '#F8FAFC', muted: '#94A3B8' },
          spring: { main: '#100E13', surface: '#15121B', editor: '#1A1622', elevated: '#211C2B', accent: '#F48FB1', text: '#FAF6FA', muted: '#AA9EB8' },
          summer: { main: '#0A1015', surface: '#0E161D', editor: '#131E27', elevated: '#192632', accent: '#2DD4BF', text: '#F5FAFC', muted: '#91B0BD' },
          autumn: { main: '#120F0D', surface: '#181412', editor: '#1F1A17', elevated: '#27211D', accent: '#F5B041', text: '#FAF7F4', muted: '#B0A396' },
          winter: { main: '#0C0E14', surface: '#10141D', editor: '#151A25', elevated: '#1B2230', accent: '#7DD3FC', text: '#F8FAFC', muted: '#94A4BE' }
        };
        var raw = localStorage.getItem('aipodium_preferences');
        var pref = raw ? JSON.parse(raw) : null;
        var setting = (pref && pref.seasonTheme) ? pref.seasonTheme : 'default';
        var resolved = setting;
        if (setting === 'auto') {
          var month = new Date().getMonth() + 1;
          resolved = (month >= 3 && month <= 5) ? 'spring' : (month >= 6 && month <= 8) ? 'summer' : (month >= 9 && month <= 11) ? 'autumn' : 'winter';
        }
        if (!palettes[resolved]) resolved = 'default';
        var p = palettes[resolved];
        var root = document.documentElement;
        root.dataset.season = resolved;
        root.dataset.seasonSetting = setting;
        root.style.setProperty('--bg-main', p.main);
        root.style.setProperty('--bg-surface', p.surface);
        root.style.setProperty('--bg-editor', p.editor);
        root.style.setProperty('--bg-elevated', p.elevated);
        root.style.setProperty('--accent-primary', p.accent);
        root.style.setProperty('--text-main', p.text);
        root.style.setProperty('--text-muted', p.muted);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', p.main);
      } catch (e) {}
    })();
  </script>
